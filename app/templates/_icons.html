{% macro icon(name, size=20) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    {% if name == 'events' %}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>
    {% elif name == 'overview' %}<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
    {% elif name == 'satellites' %}<circle cx="12" cy="12" r="3"/><path d="M5.64 5.64a9 9 0 0 0 0 12.72M18.36 5.64a9 9 0 0 1 0 12.72M8.46 8.46a5 5 0 0 0 0 7.08M15.54 8.46a5 5 0 0 1 0 7.08"/>
    {% elif name == 'quality' %}<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>
    {% elif name == 'imports' %}<path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>
    {% elif name == 'back' %}<path d="m15 18-6-6 6-6"/>
    {% elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
    {% elif name == 'users' %}<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
    {% elif name == 'checkin' %}<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1 2-2V5a2 2 0 0 1 2-2h11"/>
    {% elif name == 'chart' %}<path d="M3 3v18h18"/><path d="m7 16 4-5 4 3 5-7"/>
    {% elif name == 'church' %}<path d="M4 21h16M6 21V10l6-6 6 6v11M9 21v-6h6v6M12 4V1M10 2h4"/>
    {% elif name == 'globe' %}<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>
    {% elif name == 'unknown' %}<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.7 2.7 0 1 1 4.4 2.1c-1.1.8-1.9 1.3-1.9 2.9M12 18h.01"/>
    {% elif name == 'active' %}<circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/>
    {% elif name == 'info' %}<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>
    {% elif name == 'lock' %}<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>
    {% elif name == 'location' %}<path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="2.5"/>
    {% elif name == 'person' %}<circle cx="12" cy="7" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/>
    {% elif name == 'registrations' %}<path d="M15 21v-2a5 5 0 0 0-5-5H6a5 5 0 0 0-5 5v2"/><circle cx="8" cy="7" r="4"/><path d="M17 8h6M20 5v6M16 15h7M16 19h7"/>
    {% elif name == 'warning' %}<path d="M10.3 3.7 2.5 18a2 2 0 0 0 1.8 3h15.4a2 2 0 0 0 1.8-3L13.7 3.7a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>
    {% elif name == 'ticket' %}<path d="M3 9a3 3 0 0 0 0 6v4h18v-4a3 3 0 0 0 0-6V5H3v4z"/><path d="M13 5v2M13 11v2M13 17v2"/>
    {% elif name == 'ticket-off' %}<path d="M4 5h17v4a3 3 0 0 0 0 6v3M3 9a3 3 0 0 0 0 6v4h12M13 5v2M13 11v2M3 3l18 18"/>
    {% elif name == 'user-x' %}<circle cx="9" cy="7" r="4"/><path d="M2 21v-2a7 7 0 0 1 11-5.7M17 16l5 5M22 16l-5 5"/>
    {% elif name == 'duplicate' %}<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>
    {% elif name == 'document' %}<path d="M6 2h8l4 4v16H6z"/><path d="M14 2v5h5M9 12h6M9 16h6"/>
    {% elif name == 'arrow' %}<path d="M5 12h14M13 6l6 6-6 6"/>
    {% elif name == 'menu' %}<path d="M4 7h16M4 12h16M4 17h16"/>
    {% elif name == 'chevron-down' %}<path d="m7 9 5 5 5-5"/>
    {% elif name == 'save' %}<path d="M5 3h12l2 2v16H5z"/><path d="M8 3v6h8V3M8 21v-8h8v8"/>
    {% elif name == 'table' %}<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 9v11M15 9v11"/>
    {% elif name == 'search' %}<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>
    {% elif name == 'columns' %}<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/>
    {% elif name == 'filter' %}<path d="M4 5h16l-6 7v5l-4 2v-7z"/>
    {% elif name == 'close' %}<path d="m6 6 12 12M18 6 6 18"/>
    {% elif name == 'more' %}<circle cx="5" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="19" cy="12" r="1" fill="currentColor"/>
    {% else %}<circle cx="12" cy="12" r="9"/>{% endif %}
</svg>
{%- endmacro %}
